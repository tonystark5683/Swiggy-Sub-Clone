<div class="flex items-center justify-between px-4 lg:px-28 py-4 mx-auto text-gray-700 font-medium bg-white shadow-md">
  <div class="flex items-center space-x-2">
    <a routerLink="">
      <img src="../../assets/swiggyicon.jpeg" alt="icon" class="w-10 h-10" /> 
    </a>
    <u><span class="text-xs font-bold text-gray-700 p-2">Other</span></u> <!-- Reduced text size -->
    <i class="fa fa-chevron-down text-orange-500 ml-1 text-sm"></i> 
  </div>

  <!-- Mobile menu toggle -->
  <div class="lg:hidden flex items-center space-x-4">
    <button (click)="toggleMenu()" class="text-gray-700 text-sm">
      <i class="fa fa-bars"></i>
    </button>
  </div>

  <div class="hidden lg:flex items-center justify-between space-x-8">
    <!-- Corporate Section -->
    <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
      <i class="fa fa-briefcase mx-1 text-sm"></i> 
      <a href="#" class="hover:text-orange-500 hover:underline text-sm">Swiggy Corporate</a>
    </div>

    <!-- Search Section -->
    <div
      class="flex items-center space-x-1 hover:text-orange-600 text-sm"
      (mouseenter)="isSearchVisible = true"
      (mouseleave)="isSearchVisible = false"
    >
      <i class="fa fa-search mx-1 cursor-pointer text-sm"></i> 
      <input
        *ngIf="isSearchVisible"
        type="text"
        [(ngModel)]="searchText"
        (keyup)="onSearch()"
        placeholder="Search food or restaurant"
        class="border p-1 rounded text-xs"
      />
      <a href="#" class="hover:text-orange-500 text-sm">Search</a>
    </div>

    <!-- Offers Section -->
    <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
      <i class="fa fa-percent mx-1 text-sm"></i> 
      <a href="#" class="hover:underline text-sm">Offers</a>
      <span class="text-xxs text-orange-500 font-semibold">NEW</span> <!-- Reduced text size -->
    </div>

    <!-- Favorites Section -->
    <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
      <i class="fa-solid fa-heart text-sm"></i> 
      <a routerLink="favorite" href="#" class="hover:underline text-sm">Favorites</a>
    </div>

    <!-- Help Section -->
    <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
      <i class="fa-solid fa-question-circle text-sm"></i> 
      <a routerLink="favorite" href="#" class="hover:underline text-sm">Help</a>
    </div>

    <!-- User Section -->
    <div class="flex items-center space-x-1 hover:text-orange-600 hover:underline cursor-pointer text-sm">
      <i class="fa fa-user mx-1 text-sm"></i> 
      <div *ngIf="isLoggedIn" (click)="toggleLogout()">{{ username }}</div>
      <div *ngIf="showLogout" class="absolute bg-white shadow-md rounded p-4 mt-20 top-15">
        <button (click)="logout()" class="text-black text-sm">LogOut</button> <!-- Reduced text size -->
      </div>
      <a *ngIf="!isLoggedIn" href="#" class="hover:underline cursor-pointer text-sm" (click)="openLogin()">Sign In</a>
    </div>

    <!-- Cart Section -->
    <div routerLink="cart" class="flex items-center space-x-1 hover:text-orange-600 cursor-pointer text-sm">
      <i class="fa fa-shopping-bag text-sm"></i> 
      <span [ngClass]="cartQuantity === 0 ? 'text-black' : 'text-orange-500 font-semibold mb-4'">{{ cartQuantity }}</span>
      <a routerLink="cart" href="#" class="px-2 hover:underline text-sm">Cart</a>
    </div>
  </div>

  <!-- Mobile Menu (hidden on large screens) -->
  <div *ngIf="isMenuOpen" class="lg:hidden absolute top-16 right-0 bg-white shadow-md w-full py-4">
    <div class="flex flex-col items-center space-y-4">
      <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
        <i class="fa fa-briefcase mx-1 text-sm"></i> 
        <a href="#" class="hover:text-orange-500 hover:underline text-sm">Swiggy Corporate</a>
      </div>
      <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
        <i class="fa fa-search mx-1 cursor-pointer text-sm"></i> 
        <input
          *ngIf="isSearchVisible"
          type="text"
          [(ngModel)]="searchText"
          (keyup)="onSearch()"
          placeholder="Search food or restaurant"
          class="border p-1 rounded text-xs"
        />
        <a href="#" class="hover:text-orange-500 text-sm">Search</a>
      </div>
      <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
        <i class="fa fa-percent mx-1 text-sm"></i> 
        <a href="#" class="hover:underline text-sm">Offers</a>
        <span class="text-xxs text-orange-500 font-semibold">NEW</span> <!-- Reduced text size -->
      </div>
      <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
        <i class="fa-solid fa-heart text-sm"></i> 
        <a routerLink="favorite" href="#" class="hover:underline text-sm">Favorites</a>
      </div>
      <div class="flex items-center space-x-1 hover:text-orange-600 text-sm">
        <i class="fa-solid fa-question-circle text-sm"></i> 
        <a routerLink="favorite" href="#" class="hover:underline text-sm">Help</a>
      </div>
      <div class="flex items-center space-x-1 hover:text-orange-600 hover:underline cursor-pointer text-sm">
        <i class="fa fa-user mx-1 text-sm"></i> 
        <a *ngIf="!isLoggedIn" href="#" (click)="openLogin()">Sign In</a>
      </div>
      <div routerLink="cart" class="flex items-center space-x-1 hover:text-orange-600 cursor-pointer text-sm">
        <i class="fa fa-shopping-bag text-sm"></i> 
        <span [ngClass]="cartQuantity === 0 ? 'text-black' : 'text-orange-500 font-semibold mb-4'">{{ cartQuantity }}</span>
        <a routerLink="cart" href="#" class="px-2 hover:underline text-sm">Cart</a>
      </div>
    </div>
  </div>
</div>
